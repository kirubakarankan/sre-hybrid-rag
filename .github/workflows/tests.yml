name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to a commit, not a tag, so a moved tag cannot change what runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      # The two small models the search tests download on first use.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-v1
      # CPU-only PyTorch: the default Linux build includes GPU libraries we do not need.
      - run: pip install -r requirements.lock --extra-index-url https://download.pytorch.org/whl/cpu
      - run: python -m ruff check .
      - run: python -m pytest -q
